<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"><style>.p{animation:p 1.6s ease-in-out infinite}.spin{transform-origin:center;transform-box:fill-box;animation:s 1.4s linear infinite}
.ring{transform-origin:24px 6px;animation:r 1.6s ease-in-out infinite}.look{animation:l 3s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}@keyframes s{to{transform:rotate(360deg)}}@keyframes r{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}90%{transform:rotate(6deg)}}
@keyframes l{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="p" d="M27,4 L10,27 h12 l-3,17 L38,20 h-12 z" fill="#C6F432"/></svg>