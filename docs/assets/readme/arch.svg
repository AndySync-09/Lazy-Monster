<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Lazy-Monster architecture: mic to wake word on the NPU, speech on the GPU, a router to the quick brain on the PC or the main brain, then actions and the voice">
<style>
 text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
 .t{fill:#F3F1FF;font-weight:800;font-size:22px}.s{fill:#B9B2E6;font-size:14px}.chip{font-weight:900;font-size:13px;letter-spacing:.08em}
 .box{fill:#17122F;stroke-width:3}
 .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:4 14;animation:flow 1.1s linear infinite}
 .slow{animation-duration:1.8s}
 .glow{animation:glow 2.4s ease-in-out infinite}
 .blink{animation:blink 1.2s steps(2) infinite}
 @keyframes flow{to{stroke-dashoffset:-36}}
 @keyframes glow{50%{opacity:.45}}
 @keyframes blink{50%{opacity:0}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="560" rx="28" fill="#0D0A1F"/>
<g opacity=".5"><circle cx="90" cy="70" r="2" fill="#fff"/><circle cx="410" cy="40" r="1.6" fill="#fff"/><circle cx="780" cy="90" r="2" fill="#fff"/><circle cx="1110" cy="50" r="1.6" fill="#fff"/><circle cx="1010" cy="510" r="2" fill="#fff"/><circle cx="240" cy="520" r="1.6" fill="#fff"/></g>
<text x="40" y="52" class="t" style="font-size:26px">HOW THE MONSTER THINKS</text><text x="40" y="76" class="s">three engines, one monster. high level only.</text>
<!-- flows -->
<path class="flow" stroke="#C6F432" d="M150,270 H225"/>
<path class="flow" stroke="#C6F432" d="M395,270 H455"/>
<path class="flow" stroke="#9DB8FF" d="M625,270 H690"/>
<path class="flow" stroke="#9DB8FF" d="M790,240 C820,180 830,160 860,160"/>
<path class="flow slow" stroke="#FF5FA2" d="M790,300 C820,360 830,380 860,380"/>
<path class="flow" stroke="#C6F432" d="M1030,160 C1070,160 1080,230 1080,250"/>
<path class="flow slow" stroke="#FF5FA2" d="M1030,380 C1070,380 1080,310 1080,300"/>
<path class="flow" stroke="#F5C451" d="M1080,330 V440 H760"/>
<path class="flow" stroke="#F5C451" d="M560,440 H510"/>
<!-- mic -->
<g transform="translate(60,230)"><rect class="box" width="90" height="80" rx="20" stroke="#F3F1FF"/>
 <path d="M45,18 a11,11 0 0 1 11,11 v14 a11,11 0 0 1 -22,0 v-14 a11,11 0 0 1 11,-11z M28,44 a17,17 0 0 0 34,0 M45,62 v6" stroke="#F3F1FF" stroke-width="4" fill="none" stroke-linecap="round"/></g>
<text x="105" y="335" class="s" text-anchor="middle">you</text>
<!-- wake word NPU -->
<g transform="translate(225,215)"><rect class="box" width="170" height="110" rx="22" stroke="#C6F432"/>
 <rect x="16" y="14" width="46" height="22" rx="11" fill="#C6F432"/><text x="39" y="30" class="chip" text-anchor="middle" fill="#0D0A1F">NPU</text>
 <circle class="blink" cx="150" cy="25" r="5" fill="#C6F432"/>
 <text x="16" y="68" class="t" style="font-size:19px">wake word</text><text x="16" y="92" class="s">always on, sips power</text></g>
<!-- speech GPU -->
<g transform="translate(455,215)"><rect class="box" width="170" height="110" rx="22" stroke="#9DB8FF"/>
 <rect x="16" y="14" width="46" height="22" rx="11" fill="#9DB8FF"/><text x="39" y="30" class="chip" text-anchor="middle" fill="#0D0A1F">GPU</text>
 <text x="16" y="68" class="t" style="font-size:19px">hears you</text><text x="16" y="92" class="s">3 s of speech in 0.73 s</text></g>
<!-- router -->
<g transform="translate(690,230)"><rect class="box" width="100" height="80" rx="40" stroke="#F3F1FF"/><text x="50" y="47" class="t" text-anchor="middle" style="font-size:17px">router</text></g>
<!-- quick brain -->
<g transform="translate(860,105)"><rect class="box" width="170" height="110" rx="22" stroke="#C6F432"/>
 <rect x="16" y="14" width="46" height="22" rx="11" fill="#9DB8FF"/><text x="39" y="30" class="chip" text-anchor="middle" fill="#0D0A1F">GPU</text>
 <text x="16" y="68" class="t" style="font-size:19px">quick brain</text><text x="16" y="92" class="s">simple stuff in 0.3 s</text></g>
<!-- main brain -->
<g transform="translate(860,325)"><rect class="box" width="170" height="110" rx="22" stroke="#FF5FA2"/>
 <rect x="16" y="14" width="64" height="22" rx="11" fill="#FF5FA2"/><text x="48" y="30" class="chip" text-anchor="middle" fill="#0D0A1F">BRAIN</text>
 <text x="16" y="68" class="t" style="font-size:19px">main brain</text><text x="16" y="92" class="s">GPT, Claude or local</text></g>
<!-- actions -->
<g transform="translate(1040,250)"><rect class="box" width="80" height="80" rx="20" stroke="#F5C451"/>
 <path d="M24,52 l12,-12 l-12,-12 M42,52 h16" stroke="#F5C451" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1128" y="296" class="s">does</text><text x="1128" y="314" class="s">it</text>
<!-- voice CPU -->
<g transform="translate(560,395)"><rect class="box" width="200" height="90" rx="22" stroke="#FF5FA2"/>
 <rect x="16" y="14" width="46" height="22" rx="11" fill="#FF5FA2"/><text x="39" y="30" class="chip" text-anchor="middle" fill="#0D0A1F">CPU</text>
 <text x="16" y="66" class="t" style="font-size:19px">talks back</text><text x="92" y="31" class="s">+ voice lock</text></g>
<g transform="translate(400,400)"><rect class="box glow" width="110" height="80" rx="20" stroke="#F3F1FF"/>
 <path d="M30,40 h8 l10,-12 v24 l-10,-12 M58,30 q8,10 0,20 M66,24 q14,16 0,32" stroke="#F3F1FF" stroke-width="4" fill="none" stroke-linecap="round"/></g>
<text x="455" y="505" class="s" text-anchor="middle">you hear it</text>
<!-- brain-break note -->
<g transform="translate(40,410)"><rect width="290" height="104" rx="16" fill="#F5C451"/><text x="18" y="30" style="font:900 15px Segoe UI,Helvetica,Arial,sans-serif;fill:#0D0A1F;letter-spacing:.06em">BRAIN-BREAK</text>
 <text x="18" y="54" style="font:600 13px Segoe UI,Helvetica,Arial,sans-serif;fill:#0D0A1F">no internet? wake word, speech, voice</text>
 <text x="18" y="74" style="font:600 13px Segoe UI,Helvetica,Arial,sans-serif;fill:#0D0A1F">and the quick brain keep going.</text>
 <text x="18" y="94" style="font:600 13px Segoe UI,Helvetica,Arial,sans-serif;fill:#0D0A1F">big jobs wait for the wifi.</text></g>
</svg>
